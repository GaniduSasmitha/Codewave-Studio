<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="code-wave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="#0A0A0F" />
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="url(#code-wave-grad)" stroke-width="2" opacity="0.3" />

  <!-- Code Bracket Left: < -->
  <path d="M 21 21 L 12 32 L 21 43" fill="none" stroke="url(#code-wave-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Slash & Wave: / ~ -->
  <path d="M 36 19 L 28 45" fill="none" stroke="url(#code-wave-grad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Code Bracket Right: > -->
  <path d="M 43 21 L 52 32 L 43 43" fill="none" stroke="url(#code-wave-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>